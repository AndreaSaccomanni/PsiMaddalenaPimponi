name: Pubblica su GitHub Pages

# Ogni push su main pubblica il contenuto di static/ sul sito.
# Il sito non ha codice da compilare: sono solo file HTML, CSS e JavaScript.
# I merge da develop a main li fa il proprietario del repository.

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito statico
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

      - name: Pubblica
        id: deploy
        uses: actions/deploy-pages@v4
